[package]
name = "arm-pl061"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Arm PrimeCell GPIO (PL061) driver"
authors = [
    "Balint Dobszay <balint.dobszay@arm.com>",
    "Imre Kis <imre.kis@arm.com>",
    "Jeremi Miller <jeremimiller@google.com>",
    "Andrew Walbran <qwandor@google.com>",
]
repository = "https://git.trustedfirmware.org/arm-firmware-crates/arm-pl061.git"
keywords = ["arm", "pl061", "gpio", "driver"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]
readme = "README.md"
rust-version = "1.88"

[dependencies]
bitflags = "2.13.1"
embedded-hal = { version = "1.0.0", optional = true }
safe-mmio = "0.3.1"
thiserror = { version = "2.0.20", default-features = false }
zerocopy = "0.8.56"

[features]
default = ["embedded-hal"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
